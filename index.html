<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="blur"></div>
     <div class="expensepop">
        <div class="cut"><i class="fa-solid fa-xmark"></i></div>
        <form id="myform" action="">
            <input type="text" placeholder="Enter Subject" id="fsubject">
            <input type="text" placeholder="Enter Amount in Ruppes" id="famount">
            <select name="Category" id="fCategory">
                <option value="Online">Food</option>
                <option value="Cash">Travel</option>
                <option value="Debit Card">Shopping</option>
                <option value="Credit Card">Rent</option>
                <option value="Credit Card">Others</option>
            </select>
            <select name="Payement Mode" id="fPayement">
                <option value="Online">Online</option>
                <option value="Cash">Cash</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Credit Card">Credit Card</option>
            </select>
            <input type="submit" value="Submit">
        </form>
    </div>
    <div class="container">
        <div class="main">
            <div class="sidebar">
                <div class="profile">
                    <div class="profpic">

                    </div>
                    <div class="username">

                    </div>
                </div>
                <div class="list">
                    <ul>
                        <li class="section"><i class="fa-solid fa-house"></i><span>Home</span></li>
                        <li class="section"><i class="fa-solid fa-wallet"></i><span>Expenses</span></li>
                        <li class="section"><i class="fa-solid fa-plane-departure"></i><span>Trips</span></li>
                        <li class="section"><i class="fa-solid fa-circle-check"></i><span>Approvals</span></li>
                        <li class="section"><i class="fa-solid fa-sliders"></i><span>Settings</span></li>
                        <li class="section"><i class="fa-solid fa-headset"></i><span>Support</span></li>
                    </ul>
                </div>
                <div class="logo">
                    <h2>EXPENZA</h2>
                </div>

            </div>

            <div class="box">
                <div class="recent">
                    <div class="heading">
                        <h3>Recent Expenses</h3>
                    </div>
                    <div class="line"></div>
                    <div class="data">
                        <span class="subject">
                            <h3>Subject</h3>
                            <div class="sub">
                                <h4>Office suplies</h4>
                            </div>
                            <div class="sub">
                                <h4>hi</h4>
                            </div>
                            <div class="sub">
                                <h4>hi</h4>
                            </div>
                            <div class="sub">
                                <h4>hi</h4>
                            </div>
                        </span>
                        <span class="Employee">
                            <h3>Category</h3>
                            <div class="emp">
                                <h4>hi</h4>
                            </div>
                            <div class="emp">
                                <h4>hi</h4>
                            </div>
                            <div class="emp">
                                <h4>hi</h4>
                            </div>
                            <div class="emp">
                                <h4>hi</h4>
                            </div>
                        </span>
                        <span class="team">
                            <h3>Payment mode</h3>
                            <div class="te">
                                <h4>hi</h4>
                            </div>
                            <div class="te">
                                <h4>hi</h4>
                            </div>
                            <div class="te">
                                <h4>hi</h4>
                            </div>
                            <div class="te">
                                <h4>hi</h4>
                            </div>
                        </span>
                        <span class="amount">
                            <h3>Amount</h3>
                            <div class="amo">
                                <h4>hi</h4>
                            </div>
                            <div class="amo">
                                <h4>hi</h4>
                            </div>
                            <div class="amo">
                                <h4>hi</h4>
                            </div>
                            <div class="amo">
                                <h4>hi</h4>
                            </div>
                        </span>
                    </div>
                </div>
                <div class="quick">
                    <h3>Quick Access</h3>
                    <div class="btn1">
                        <button class="btn"><i class="fa-solid fa-circle-plus"></i><h4>New Expense</h4></button>
                        <button class="btn"><i class="fa-solid fa-receipt"></i><h4>Add Receipts</h4></button>
                        <button class="btn"><i class="fa-solid fa-chart-column"></i><h4>Create Report</h4></button>
                        <button class="btn"><i class="fa-solid fa-map-location-dot"></i><h4>New Expense</h4></button>
                    </div>
                </div>
                <div class="monthly">
                    <div class="heading">
                        <h3>Monthly Report</h3>
                    </div>
                    <div class="line"></div>
                    <div class="analytics">
                        <div class="monthchart">
                            <div class="heading1">
                                <h4>Team Spending Trend</h4>
                            </div>
                            <div class="chart1">
                                <canvas id="monthlyChart"></canvas>
                            </div>
                        </div>
                        <div class="vline"></div>
                        <div class="daychart">
                            <div class="heading2">
                                <h4>Day - To - Day Spending </h4>
                            </div>
                            <div class="chart2">
                                <canvas id="expenseChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
