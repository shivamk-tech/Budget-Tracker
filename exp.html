<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            width: 100vw;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: black;
        }

        .expensepop {
            height: auto;
            width: 350px;
            transform: scale(0);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background-color: #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #334155;
            position: relative;
        }

        .expensepop form {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            align-items: center;
            gap: 15px;
        }

        .expensepop input,
        .expensepop select {
            all: unset;
            box-sizing: border-box;
            border-radius: 8px;
            height: 45px;
            width: 100%;
            background-color: #334155;
            color: #f8fafc;
            display: flex;
            padding: 0 15px;
            font-family: system-ui, -apple-system, sans-serif;
            border: 1px solid transparent;
            transition: all 0.2s;
            align-items: center;
        }

        .expensepop input:focus,
        .expensepop select:focus {
            border-color: #38bdf8;
            background-color: #0f172a;
        }

        .expensepop input[type="submit"] {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            justify-content: center;
            margin-top: 10px;
        }

        .expensepop input[type="submit"]:hover {
            background-color: #0ea5e9;
        }

        .active {
            transform: scale(1);
            opacity: 1;
        }

        button {
            position: absolute;
            top: 0;
            left: 0;
        }

        .cut {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer
        }
    </style>
</head>

<body>
    
    <script src="exp.js"></script>
</body>

</html>
